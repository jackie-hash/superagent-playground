name: ask-agent
on:
  workflow_dispatch:
    inputs:
      body:
        description: Request body
        required: false
        default: "@jackie-hash please add a CONTRIBUTING.md with one short paragraph saying contributions are welcome."
permissions:
  issues: write
jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: ${{ inputs.body }}
        run: gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body "$BODY"
